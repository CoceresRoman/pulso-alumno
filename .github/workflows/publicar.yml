name: publicar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # "build once, promote": en un push a main se construye y se escanea de verdad; en un tag
  # v* no se reconstruye nada (otro build daría OTRO digest: metadata-action agrega
  # org.opencontainers.image.created con la hora del run, y provenance suma atestaciones con
  # timestamp). El job promover más abajo reetiqueta el digest que ya publicó main.
  build:
    name: build (${{ matrix.nombre }})
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: app
            contexto: .
            dockerfile: Dockerfile
          - nombre: web
            contexto: web
            dockerfile: web/Dockerfile
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: QEMU (emular arm64 en un runner x64)
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: Preparar buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build multi-arch (sin push, valida que compila para las dos plataformas)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=pulso-alumno-${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=pulso-alumno-${{ matrix.nombre }}

      - name: Build local linux/amd64 (para escanear con Trivy)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: pulso-alumno-${{ matrix.nombre }}:escanear
          cache-from: type=gha,scope=pulso-alumno-${{ matrix.nombre }}

      - name: Trivy (bloquea con CRITICAL con arreglo disponible)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pulso-alumno-${{ matrix.nombre }}:escanear
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy (reporte HIGH y CRITICAL, no bloquea)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pulso-alumno-${{ matrix.nombre }}:escanear
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          output: trivy-resumen.txt

      - name: Volcar el resumen de Trivy
        if: always()
        run: |
          {
            echo "### Trivy (${{ matrix.nombre }}) — HIGH y CRITICAL (informativo, no bloquea)"
            echo
            echo '```'
            cat trivy-resumen.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  publicar:
    name: publicar (${{ matrix.nombre }})
    needs: build
    if: github.event_name != 'pull_request' && github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: app
            contexto: .
            dockerfile: Dockerfile
            imagen: ghcr.io/coceresroman/pulso-alumno-app
          - nombre: web
            contexto: web
            dockerfile: web/Dockerfile
            imagen: ghcr.io/coceresroman/pulso-alumno-web
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: QEMU (emular arm64 en un runner x64)
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: Preparar buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login a GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags y labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.imagen }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build y push multi-arch
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pulso-alumno-${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=pulso-alumno-${{ matrix.nombre }}
          sbom: true
          provenance: true

      - name: Atestiguar la procedencia del build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.imagen }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  firmar:
    name: firmar (${{ matrix.nombre }})
    needs: publicar
    if: github.event_name != 'pull_request' && github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: app
            imagen: ghcr.io/coceresroman/pulso-alumno-app
          - nombre: web
            imagen: ghcr.io/coceresroman/pulso-alumno-web
    steps:
      - name: Login a GHCR (cosign necesita subir la firma como capa nueva)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolver el digest recién publicado (tag sha-<7>)
        env:
          IMAGEN: ${{ matrix.imagen }}
        run: |
          sha_corto="sha-${GITHUB_SHA:0:7}"
          digest=$(docker buildx imagetools inspect "${IMAGEN}:${sha_corto}" | awk '/^Digest:/{print $2; exit}')
          echo "digest=$digest" >> "$GITHUB_ENV"

      - name: Firmar la imagen (keyless)
        env:
          IMAGEN: ${{ matrix.imagen }}
        run: cosign sign --yes "${IMAGEN}@${digest}"

      - name: Verificar la firma
        env:
          IMAGEN: ${{ matrix.imagen }}
        run: |
          cosign verify "${IMAGEN}@${digest}" \
            --certificate-identity-regexp "^https://github.com/CoceresRoman/pulso-alumno/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  # Se dispara con el tag; NO reconstruye nada. Busca el digest que ya publicó (y firmó y
  # atestiguó) el push a main para este mismo commit, y le agrega los tags semver encima con
  # `imagetools create` — mismo digest, sin recompilar.
  promover:
    name: promover (${{ matrix.nombre }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: app
            imagen: ghcr.io/coceresroman/pulso-alumno-app
          - nombre: web
            imagen: ghcr.io/coceresroman/pulso-alumno-web
    steps:
      - name: Preparar buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login a GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular los tags semver (sin build)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.imagen }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Promover el digest de main con los tags del release
        env:
          IMAGEN: ${{ matrix.imagen }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          sha_corto="sha-${GITHUB_SHA:0:7}"
          if ! docker buildx imagetools inspect "${IMAGEN}:${sha_corto}" >/dev/null 2>&1; then
            echo "::error::no existe ${IMAGEN}:${sha_corto} en GHCR — este tag apunta a un commit que no pasó por un push a main"
            exit 1
          fi
          args=()
          while IFS= read -r t; do
            [ -n "$t" ] && args+=("-t" "$t")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMAGEN}:${sha_corto}"

      - name: Instalar cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verificar la firma del digest promovido
        run: |
          digest=$(docker buildx imagetools inspect "${{ matrix.imagen }}:sha-${GITHUB_SHA:0:7}" | awk '/^Digest:/{print $2; exit}')
          cosign verify "${{ matrix.imagen }}@${digest}" \
            --certificate-identity-regexp "^https://github.com/CoceresRoman/pulso-alumno/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  release:
    name: release
    needs: promover
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Crear la release con notas generadas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: gh release create "$REF_NAME" --generate-notes
