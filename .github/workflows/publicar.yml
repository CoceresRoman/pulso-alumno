name: publicar

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore:
      - "dependabot/**"
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-app:
    uses: ./.github/workflows/reutilizable-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image: ghcr.io/coceresroman/pulso-alumno-app
      context: .
      dockerfile: Dockerfile
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  firmar:
    needs: build-app
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Login a GHCR (cosign necesita subir la firma como capa nueva)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Firmar la imagen (keyless)
        env:
          DIGEST: ${{ needs.build-app.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/coceresroman/pulso-alumno-app@${DIGEST}"

      - name: Verificar la firma
        env:
          DIGEST: ${{ needs.build-app.outputs.digest }}
        run: |
          cosign verify "ghcr.io/coceresroman/pulso-alumno-app@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/CoceresRoman/pulso-alumno/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  desplegar:
    needs: [build-app, firmar]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/desplegar.yml
    permissions:
      contents: read
    with:
      digest: ${{ needs.build-app.outputs.digest }}
    secrets: inherit
