name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  integracion:
    name: integracion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pulso
          POSTGRES_PASSWORD: pulso
          POSTGRES_DB: pulso_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulso -d pulso_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:9.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pulso:pulso@postgres:5432/pulso_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests de integración
        timeout-minutes: 5
        run: |
          set +e
          npm run test:integracion > reporte-integracion.txt 2>&1
          codigo=$?
          cat reporte-integracion.txt
          exit $codigo
