x-pulso: &pulso
  image: ${PULSO_IMAGEN_APP:-pulso-app}:${PULSO_TAG:-dev}
  build: .
  environment: &pulso-env
    DATABASE_URL: postgres://pulso:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD (copiá .env.ejemplo a .env)}@postgres:5432/pulso
    REDIS_URL: redis://valkey:6379
    LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD (copiá .env.ejemplo a .env)}
      POSTGRES_DB: pulso
    volumes:
      - datos-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulso -d pulso"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9.1
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrar:
    <<: *pulso
    command: ["node", "dist/migrar.js"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *pulso
    depends_on:
      migrar:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  worker:
    <<: *pulso
    command: ["node", "dist/worker/principal.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9464/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 30s
    depends_on:
      migrar:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  sitio-lento:
    <<: *pulso
    command: ["node", "dist/sitio-lento/servidor.js"]
    environment:
      <<: *pulso-env
      PORT: "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    profiles: [labs]

  web:
    image: ${PULSO_IMAGEN_WEB:-pulso-web}:${PULSO_TAG:-dev}
    build: web
    environment:
      PULSO_API_URL: http://api:3000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
        restart: true
    ports:
      - "8080:8080"

volumes:
  datos-postgres:
